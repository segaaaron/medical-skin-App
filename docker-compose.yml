# Servicios de desarrollo de MedSkin.
# Las credenciales de este archivo son locales y de desarrollo: no sirven fuera de esta máquina
# y no se usan en ningún entorno real. Los secretos de verdad no viven en el repositorio.
services:
  postgres:
    image: postgres:17-alpine
    container_name: medskin-postgres
    # 5433 a propósito: deja libre el 5432 del PostgreSQL 16 ya instalado en el sistema
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: medskin_owner
      POSTGRES_PASSWORD: dev_local_only
      POSTGRES_DB: medskin
    volumes:
      - medskin-pg:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medskin_owner -d medskin"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 de desarrollo. MinIO salió de Docker Hub en 2025 y su imagen pide cuenta;
  # LocalStack da el mismo S3 para desarrollo sin registro ninguno.
  s3:
    image: localstack/localstack:4
    container_name: medskin-s3
    ports: ["4566:4566"]
    environment:
      SERVICES: s3
      DEBUG: "0"
      PERSISTENCE: "1"
      # LA FIRMA SE COMPRUEBA, Y NO ERA LO PREDETERMINADO. LocalStack trae
      # `S3_SKIP_SIGNATURE_VALIDATION=1` de serie: no valida ni la firma ni la caducidad de un
      # enlace prefirmado. Medido el 29 de octubre de 2026 —aceptó un `DELETE` con una firma de
      # 64 ceros y borró el objeto—, así que **toda prueba de URL firmada pasaba en verde
      # contra un almacenamiento que no comprobaba lo que se estaba probando**: fue lo que tapó
      # que los tres sitios que borran objetos firmaban un `GET` y llamaban con `DELETE`.
      #
      # Con esto en `0`, la firma tiene que cuadrar de verdad —el método entra en ella— y la
      # caducidad también. La validación solo puede pasar si la clave secreta es `test`, que es
      # la de `.env.example`.
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    volumes:
      - medskin-s3:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": *\"available\"'"]
      interval: 5s
      timeout: 3s
      retries: 30

  # PgBouncer en MODO TRANSACCIÓN, el mismo que habrá en producción.
  # Está en desarrollo a propósito: es donde se demuestra que el contexto de inquilino
  # fijado con un SET de sesión se filtraría al siguiente cliente que reutiliza la conexión.
  # La aplicación puede apuntar aquí; las migraciones nunca, van directas al dueño.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: medskin-pgbouncer
    depends_on:
      postgres: { condition: service_healthy }
    # PgBouncer escucha en 5432 dentro del contenedor; 6432 es solo el puerto del anfitrión.
    ports: ["6432:5432"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: medskin
      DB_USER: medskin
      DB_PASSWORD: dev_local_only
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
      # Con pool en modo transacción no puede haber sentencias preparadas con nombre
      # compartidas entre transacciones: node-postgres usa las anónimas y así funciona.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U medskin -d medskin"]
      interval: 5s
      timeout: 3s
      retries: 20

# El correo de desarrollo lo atrapa el Mailpit que ya corre en esta máquina (1025 · panel en 8025).
# No se duplica en un contenedor: ya está, y dos procesos no pueden escuchar el mismo puerto.
volumes:
  medskin-pg:
  medskin-s3:
